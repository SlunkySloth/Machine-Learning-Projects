[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-rubric-project"
version = "1.0.0"
description = "Reproducible ANN and calibrated ensemble diabetes classification study"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "scikit-learn>=1.6,<2", "matplotlib>=3.8,<4", "joblib>=1.3,<2"]

[tool.setuptools.packages.find]
where = ["src"]
